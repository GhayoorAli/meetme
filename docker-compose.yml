# Local: PostgreSQL + LiveKit. Next.js and Expo run on the host.
services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: meetme
      POSTGRES_PASSWORD: meetme
      POSTGRES_DB: meet_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetme -d meet_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

volumes:
  postgres_data:
